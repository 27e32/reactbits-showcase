<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShinyText · React Bits 效果预览台</title>
<style>
  :root{
    --bg:#0a0b0d;
    --panel:rgba(16,18,22,.86);
    --line:rgba(255,255,255,.13);
    --dim:rgba(255,255,255,.46);
    --ink:#e8ebef;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1300px 700px at 50% 44%, #16191f 0%, #0a0b0d 72%);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }
  #grid{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.036) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.036) 1px, transparent 1px);
    background-size:40px 40px;
    -webkit-mask-image:radial-gradient(900px 460px at 50% 46%, #000 15%, transparent 78%);
    mask-image:radial-gradient(900px 460px at 50% 46%, #000 15%, transparent 78%);
  }
  #wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{
    width:100%;height:480px;position:relative;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }

  /* ===== ShinyText 原样式（照搬） ===== */
  .shiny-text {
    position: relative;
    display: inline-block;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
    line-height: 1.15;
    letter-spacing: -0.01em;
    font-family:inherit;
  }
  .shiny-text__glow {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    filter: blur(0.14em);
    pointer-events: none;
    user-select: none;
  }

  /* ---------- 控制面板 ---------- */
  #panel{
    position:fixed;top:16px;right:16px;width:274px;z-index:20;
    background:var(--panel);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    font-size:12px;
    max-height:calc(100vh - 32px);
    display:flex;flex-direction:column;overflow:hidden;
  }
  #panel header{
    display:flex;align-items:center;gap:8px;
    padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #panel header b{font-weight:600;letter-spacing:.02em;flex:1;font-size:12.5px}
  #panel header .tag{
    font-size:10px;color:var(--dim);border:1px solid var(--line);
    padding:1px 6px;border-radius:99px;
  }
  #panel header button{
    appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);
    width:20px;height:20px;line-height:1;border-radius:6px;cursor:pointer;font-size:12px;
    display:grid;place-items:center;padding:0;
  }
  #panel header button:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  #controls{padding:12px 13px 6px;overflow-y:auto;overflow-x:hidden}
  #panel.collapsed #controls,#panel.collapsed footer{display:none}

  .row{
    display:grid;grid-template-columns:66px 1fr 40px;
    align-items:center;gap:8px;margin-bottom:9px;
  }
  .row>span{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row>em{
    font-style:normal;text-align:right;color:#fff;opacity:.85;
    font-size:10.5px;font-variant-numeric:tabular-nums;
  }
  .row.two{grid-template-columns:66px 1fr}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer;accent-color:#fff;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    background:#fff;border:none;box-shadow:0 0 0 3px rgba(255,255,255,.13);
  }
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:none}
  input[type=text],select{
    width:100%;background:rgba(255,255,255,.05);color:#fff;
    border:1px solid var(--line);border-radius:7px;padding:4px 7px;
    font-family:inherit;font-size:11.5px;outline:none;
  }
  input[type=text]:focus,select:focus{border-color:rgba(255,255,255,.34)}
  select option{background:#14161a;color:#e8ebef}
  input[type=color]{
    -webkit-appearance:none;appearance:none;border:1px solid var(--line);
    background:transparent;width:100%;height:22px;border-radius:7px;padding:1px;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
  .sw{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 0;color:var(--dim);font-size:11px;cursor:pointer;
  }
  .sw input{display:none}
  .sw i{
    width:26px;height:15px;border-radius:99px;background:rgba(255,255,255,.14);
    position:relative;transition:.18s;flex:0 0 auto;
  }
  .sw i::after{
    content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#8c939c;transition:.18s;
  }
  .sw input:checked+i{background:rgba(255,255,255,.9)}
  .sw input:checked+i::after{transform:translateX(11px);background:#0a0b0d}
  hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0 10px}
  #panel footer{padding:0 13px 12px;flex:0 0 auto;display:grid;gap:7px}
  #panel footer button{
    width:100%;appearance:none;background:rgba(255,255,255,.055);color:var(--dim);
    border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;
    font-family:inherit;cursor:pointer;letter-spacing:.03em;
  }
  #panel footer button:hover{color:#fff;background:rgba(255,255,255,.1)}
  #panel footer button.primary{background:rgba(255,255,255,.9);color:#0a0b0d;border-color:transparent;font-weight:600}
  #panel footer button.primary:hover{background:#fff}

  #hint{
    position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.06em;pointer-events:none;
  }

  /* ================= 移动端适配 (mobile-adapt-v1) ================= */
  @media (max-width: 820px){
    /* 画布吃满整个视口，并接管触摸手势（几个页面都是全屏交互画布，不需要页面滚动） */
    #stage{
      height: 100vh;
      height: 100dvh;
      touch-action: none;
    }
    /* 底部提示在窄屏会换行挡内容，直接隐藏 */
    #hint{ display: none; }
    /* 诊断信息移到顶部，抽屉展开时也能看到 */
    #stats{
      top: 10px;
      bottom: auto;
      left: 12px;
      right: 12px;
      font-size: 9.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 控制面板改造成底部抽屉：默认只露出顶部 50px */
    #panel{
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 64vh;
      height: 64dvh;
      max-height: none;
      border-radius: 16px 16px 0 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      transform: translateY(calc(100% - 50px));
      transition: transform .3s cubic-bezier(.22,1,.36,1);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #panel.open{ transform: translateY(0); }
    #panel header{
      position: relative;
      padding-top: 17px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    /* 抽屉把手 */
    #panel header::before{
      content: '';
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,.22);
    }
  }

</style>
</head>
<body>
<div id="grid"></div>

<div id="wrap">
  <div id="stage">
    <span id="shiny" class="shiny-text"></span>
  </div>
</div>

<aside id="panel">
  <header>
    <b>ShinyText</b>
    <span class="tag">react-bits</span>
    <button id="collapse" title="折叠">−</button>
  </header>
  <div id="controls"></div>
  <footer>
    <button id="replay" class="primary">立即扫过一次</button>
    <button id="reset">恢复默认参数</button>
  </footer>
</aside>

<div id="hint">光带按当前参数自动扫过 · 切换到「悬停 / 进入视口」触发方式后需要手动交互 · 指针移入文字区域会重新唤醒动画</div>

<script>
(function(){
  'use strict';

  /* ================= 默认参数（对应用户提供的 props） ================= */
  const DEFAULTS = {
    text: 'Shiny Text Effect',
    color: '#b5b5b5',
    shineColor: '#f46161',
    speed: 2,
    delay: 0,
    angle: 120,
    shineWidth: 40,
    softness: 0.8,
    bands: 1,
    glow: 0,
    direction: 'right',
    easing: 'smooth',
    trigger: 'loop',
    yoyo: false,
    followPointer: false,
    pauseOnHover: false,
    disabled: false,
    fontSize: 88,
    fontWeight: 600
  };
  const CFG = Object.assign({}, DEFAULTS);

  /* ================= 原组件常量与工具（照搬） ================= */
  const EASINGS = {
    linear: t => t,
    smooth: t => 0.5 - Math.cos(Math.PI * t) / 2,
    snappy: t => (t < 0.5 ? 16 * Math.pow(t, 5) : 1 - Math.pow(-2 * t + 2, 5) / 2)
  };
  const TRIGGERS = ['loop', 'hover', 'view'];
  const FALLOFF = [0, 0.2, 0.4, 0.6, 0.8, 1];

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  let paint = null;
  const parseColor = value => {
    if (typeof document === 'undefined') return null;
    if (!paint) paint = document.createElement('canvas').getContext('2d');
    if (!paint) return null;
    paint.fillStyle = '#000000';
    paint.fillStyle = value;
    const resolved = String(paint.fillStyle);
    if (resolved.startsWith('#')) {
      return [1, 3, 5].map(i => parseInt(resolved.slice(i, i + 2), 16)).concat(1);
    }
    const parts = resolved.match(/[\d.]+/g);
    if (!parts || parts.length < 3) return null;
    return [Number(parts[0]), Number(parts[1]), Number(parts[2]), parts.length > 3 ? Number(parts[3]) : 1];
  };

  const blend = (from, to, amount) => {
    const channel = (a, b) =>
      Math.round(Math.pow(Math.pow(a / 255, 2.2) * (1 - amount) + Math.pow(b / 255, 2.2) * amount, 1 / 2.2) * 255);
    const alpha = from[3] * (1 - amount) + to[3] * amount;
    if (alpha <= 0) return 'rgba(0, 0, 0, 0)';
    const weigh = (a, b) => (a * from[3] * (1 - amount) + b * to[3] * amount) / alpha;
    const r = from[3] === to[3] ? channel(from[0], to[0]) : Math.round(weigh(from[0], to[0]));
    const g = from[3] === to[3] ? channel(from[1], to[1]) : Math.round(weigh(from[1], to[1]));
    const b = from[3] === to[3] ? channel(from[2], to[2]) : Math.round(weigh(from[2], to[2]));
    return `rgba(${r}, ${g}, ${b}, ${Math.round(alpha * 1000) / 1000})`;
  };

  /* ================= 运行时（移植自 useEffect 内部） ================= */
  const root = document.getElementById('shiny');
  const stage = document.getElementById('stage');
  let glowEl = null;
  let settings = null;
  const state = {
    pos: null, vel: 0, phase: 'idle', from: 0, to: 0, start: 0,
    duration: 1, resume: 0, flip: false, inside: false, target: 0,
    visible: true, seen: false, colors: ''
  };
  let base = null, shine = null, clear = null;
  let raf = 0, timer = 0, last = 0, alive = true;

  const reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;

  function readSettings(){
    return {
      color: CFG.color,
      shineColor: CFG.shineColor,
      speed: Math.max(0.1, CFG.speed),
      delay: Math.max(0, CFG.delay),
      angle: CFG.angle,
      shineWidth: clamp(CFG.shineWidth, 2, 200),
      softness: clamp(CFG.softness, 0, 1),
      bands: clamp(Math.round(CFG.bands), 1, 3),
      glow: clamp(CFG.glow, 0, 1),
      sign: CFG.direction === 'right' ? 1 : -1,
      ease: EASINGS[CFG.easing] || EASINGS.smooth,
      trigger: TRIGGERS.includes(CFG.trigger) ? CFG.trigger : 'loop',
      yoyo: CFG.yoyo,
      followPointer: CFG.followPointer,
      pauseOnHover: CFG.pauseOnHover,
      disabled: CFG.disabled
    };
  }

  const extent = () => {
    const s = settings;
    return s.shineWidth / 2 + (s.bands - 1) * s.shineWidth * 1.3 + 2;
  };
  const entry = () => (settings.sign > 0 ? -extent() : 100 + extent());
  const exit  = () => (settings.sign > 0 ? 100 + extent() : -extent());
  const nearest = () => (state.target < 50 ? -extent() : 100 + extent());

  const gradient = (pos, fill) => {
    const s = settings;
    const half = s.shineWidth / 2;
    const core = half * (1 - s.softness);
    const fade = half - core;
    const stops = [];
    for (let band = 0; band < s.bands; band++) {
      const center = pos - s.sign * band * s.shineWidth * 1.3;
      const strength = 1 - band * 0.28;
      for (const side of [-1, 1]) {
        for (const f of FALLOFF) {
          const at = center + side * (core + fade * (1 - f));
          const amount = f * f * (3 - 2 * f) * strength;
          stops.push([at, amount]);
        }
      }
    }
    stops.sort((a, b) => a[0] - b[0]);
    const list = stops.map(([at, amount]) => `${blend(fill, shine, amount)} ${at.toFixed(2)}%`);
    return `linear-gradient(${s.angle}deg, ${blend(fill, shine, 0)} 0%, ${list.join(', ')}, ${blend(fill, shine, 0)} 100%)`;
  };

  const draw = () => {
    const s = settings;
    const key = `${s.color}|${s.shineColor}`;
    if (key !== state.colors) {
      state.colors = key;
      base = parseColor(s.color);
      shine = parseColor(s.shineColor);
      clear = shine ? [shine[0], shine[1], shine[2], 0] : null;
    }
    if (!base || !shine) {
      root.style.backgroundImage = `linear-gradient(${s.color}, ${s.color})`;
      return;
    }
    if (state.pos === null || s.disabled) {
      root.style.backgroundImage = `linear-gradient(${s.color}, ${s.color})`;
      if (glowEl) glowEl.style.backgroundImage = 'none';
      return;
    }
    root.style.backgroundImage = gradient(state.pos, base);
    if (glowEl) {
      glowEl.style.backgroundImage = gradient(state.pos, clear);
      glowEl.style.opacity = String(s.glow);
    }
  };

  const sweep = (from, to, now) => {
    const s = settings;
    const span = Math.abs(exit() - entry()) || 1;
    state.phase = 'sweep';
    state.from = from;
    state.to = to;
    state.start = now;
    state.duration = s.speed * 1000 * Math.max(0.15, Math.abs(to - from) / span);
  };

  const wake = () => {
    if (raf || !alive) return;
    window.clearTimeout(timer);
    timer = 0;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  };

  function tick(now){
    raf = 0;
    if (!alive) return;
    const s = settings;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;

    if (s.disabled){
      state.pos = null;
      state.phase = 'idle';
      draw();
      return;
    }

    const following = s.followPointer && state.inside;
    if (following){
      if (state.pos === null) state.pos = nearest();
      const stiffness = 220;
      state.vel += ((state.target - state.pos) * stiffness - state.vel * 2 * Math.sqrt(stiffness)) * dt;
      state.pos += state.vel * dt;
      state.phase = 'follow';
      draw();
      raf = requestAnimationFrame(tick);
      return;
    }

    if (state.phase === 'follow'){
      state.vel = 0;
      sweep(state.pos === null ? nearest() : state.pos, nearest(), now);
    }

    if (state.phase === 'sweep'){
      if (s.pauseOnHover && state.inside){
        state.start += dt * 1000;
        raf = requestAnimationFrame(tick);
        return;
      }
      const t = clamp((now - state.start) / state.duration, 0, 1);
      state.pos = state.from + (state.to - state.from) * s.ease(t);
      draw();
      if (t < 1){ raf = requestAnimationFrame(tick); return; }
      if (s.trigger !== 'loop' || reduce){
        state.phase = 'idle';
        state.pos = null;
        draw();
        return;
      }
      state.phase = 'wait';
      state.resume = now + s.delay * 1000;
    }

    if (state.phase === 'wait'){
      if (!state.visible) return;
      if (now < state.resume){
        window.clearTimeout(timer);
        timer = window.setTimeout(wake, state.resume - now);
        return;
      }
      if (s.yoyo){
        state.flip = !state.flip;
        sweep(state.flip ? exit() : entry(), state.flip ? entry() : exit(), now);
      } else {
        sweep(entry(), exit(), now);
      }
      raf = requestAnimationFrame(tick);
      return;
    }

    if (state.phase === 'idle' && s.trigger === 'loop' && !reduce && state.visible){
      state.flip = false;
      sweep(entry(), exit(), now);
      raf = requestAnimationFrame(tick);
    }
  }

  const locate = event => {
    const s = settings;
    const rect = root.getBoundingClientRect();
    const radians = (s.angle * Math.PI) / 180;
    const dx = Math.sin(radians);
    const dy = -Math.cos(radians);
    const length = Math.abs(rect.width * dx) + Math.abs(rect.height * dy) || 1;
    const along =
      (event.clientX - rect.left - rect.width / 2) * dx +
      (event.clientY - rect.top - rect.height / 2) * dy;
    return 50 + (along / length) * 100;
  };

  const onEnter = event => {
    const s = settings;
    state.inside = true;
    state.target = locate(event);
    if (s.disabled) return;
    if (s.followPointer){
      if (state.pos === null) state.pos = nearest();
    } else if (s.trigger === 'hover' && state.phase === 'idle' && !reduce){
      sweep(entry(), exit(), performance.now());
    }
    wake();
  };
  const onMove = event => {
    state.target = locate(event);
    if (settings.followPointer) wake();
  };
  const onLeave = () => { state.inside = false; wake(); };

  const observer = new IntersectionObserver(entries => {
    const visible = entries.some(item => item.isIntersecting);
    state.visible = visible;
    if (!visible) return;
    const s = settings;
    if (s.trigger === 'view' && !state.seen && !reduce && !s.disabled){
      state.seen = true;
      sweep(entry(), exit(), performance.now());
    }
    wake();
  });

  function sync(){
    const s = settings;
    if (s.disabled){
      state.pos = null;
      state.phase = 'idle';
    } else if (s.trigger !== 'loop' && state.phase === 'wait'){
      state.phase = 'idle';
      state.pos = null;
    }
    draw();
    wake();
  }

  /* ================= 内容与适配 ================= */
  function renderContent(){
    root.style.fontSize = CFG.fontSize + 'px';
    root.style.fontWeight = CFG.fontWeight;
    if (glowEl){ glowEl.remove(); glowEl = null; }
    root.textContent = CFG.text;
    if (CFG.glow > 0){
      glowEl = document.createElement('span');
      glowEl.className = 'shiny-text__glow';
      glowEl.setAttribute('aria-hidden','true');
      glowEl.textContent = CFG.text;
      root.appendChild(glowEl);
    }
    fit();
  }

  function fit(){
    root.style.transform = 'none';
    const avail = stage.clientWidth * 0.9;
    const w = root.getBoundingClientRect().width;
    if (w > avail && w > 0){
      root.style.transform = `scale(${(avail / w).toFixed(4)})`;
    }
  }

  /* ================= 控制面板 ================= */
  const CONTROLS = [
    { k:'text',       t:'text',   label:'文字内容', en:'text' },
    { k:'fontSize',   t:'range',  label:'字号',     en:'fontSize',   min:24,  max:200, step:2 },
    { k:'fontWeight', t:'range',  label:'字重',     en:'fontWeight', min:100, max:900, step:100 },
    { k:'__sep1', t:'sep' },
    { k:'color',      t:'color',  label:'文字颜色', en:'color' },
    { k:'shineColor', t:'color',  label:'高光颜色', en:'shineColor' },
    { k:'__sep2', t:'sep' },
    { k:'speed',      t:'range',  label:'扫过速度', en:'speed',      min:0.1, max:8,   step:0.1 },
    { k:'delay',      t:'range',  label:'间隔延迟', en:'delay',      min:0,   max:5,   step:0.1 },
    { k:'angle',      t:'range',  label:'光带角度', en:'angle',      min:0,   max:360, step:1 },
    { k:'shineWidth', t:'range',  label:'高光宽度', en:'shineWidth', min:2,   max:200, step:1 },
    { k:'softness',   t:'range',  label:'柔化程度', en:'softness',   min:0,   max:1,   step:0.05 },
    { k:'bands',      t:'range',  label:'光带数量', en:'bands',      min:1,   max:3,   step:1 },
    { k:'glow',       t:'range',  label:'辉光强度', en:'glow',       min:0,   max:1,   step:0.05 },
    { k:'__sep3', t:'sep' },
    { k:'direction',  t:'select', label:'扫过方向', en:'direction', opts:['left','right'] },
    { k:'easing',     t:'select', label:'缓动曲线', en:'easing',    opts:['linear','smooth','snappy'] },
    { k:'trigger',    t:'select', label:'触发方式', en:'trigger',   opts:['loop','hover','view'] },
    { k:'__sep4', t:'sep' },
    { k:'yoyo',         t:'toggle', label:'往返扫动', en:'yoyo' },
    { k:'followPointer',t:'toggle', label:'跟随指针', en:'followPointer' },
    { k:'pauseOnHover', t:'toggle', label:'悬停暂停', en:'pauseOnHover' },
    { k:'disabled',     t:'toggle', label:'停用效果', en:'disabled' }
  ];

  const OPT_LABELS = {
    direction: { left:'向左', right:'向右' },
    easing:    { linear:'线性', smooth:'平滑', snappy:'弹跳' },
    trigger:   { loop:'循环', hover:'悬停', view:'进入视口' }
  };

  function refresh(){
    settings = readSettings();
    sync();
  }

  function buildPanel(){
    const box = document.getElementById('controls');
    box.textContent = '';
    CONTROLS.forEach(c => {
      if (c.t === 'sep'){
        const hr = document.createElement('hr'); hr.className = 'sep'; box.appendChild(hr); return;
      }
      if (c.t === 'toggle'){
        const lab = document.createElement('label'); lab.className = 'sw';
        const sp = document.createElement('span'); sp.textContent = c.label; sp.title = c.en;
        const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!CFG[c.k];
        const ii = document.createElement('i');
        lab.append(sp, inp, ii);
        inp.addEventListener('change', () => { CFG[c.k] = inp.checked; refresh(); });
        box.appendChild(lab);
        return;
      }
      const row = document.createElement('div');
      row.className = 'row' + (c.t === 'range' ? '' : ' two');
      const sp = document.createElement('span'); sp.textContent = c.label; sp.title = c.en;
      row.appendChild(sp);

      if (c.t === 'range'){
        const inp = document.createElement('input');
        inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = CFG[c.k];
        const em = document.createElement('em'); em.textContent = CFG[c.k];
        inp.addEventListener('input', () => {
          CFG[c.k] = parseFloat(inp.value);
          em.textContent = inp.value;
          if (c.k === 'fontSize' || c.k === 'fontWeight') renderContent();
          if (c.k === 'glow') renderContent();
          refresh();
        });
        row.append(inp, em);
      } else if (c.t === 'select'){
        const sl = document.createElement('select');
        c.opts.forEach(o => {
          const op = document.createElement('option');
          op.value = o;
          op.textContent = (OPT_LABELS[c.k] && OPT_LABELS[c.k][o]) || o;
          if (CFG[c.k] === o) op.selected = true;
          sl.appendChild(op);
        });
        sl.addEventListener('change', () => {
          CFG[c.k] = sl.value;
          if (c.k === 'trigger') state.seen = false;
          refresh();
        });
        row.appendChild(sl);
      } else if (c.t === 'text'){
        const inp = document.createElement('input');
        inp.type = 'text'; inp.value = CFG[c.k];
        inp.addEventListener('input', () => {
          CFG[c.k] = inp.value;
          renderContent();
        });
        row.appendChild(inp);
      } else if (c.t === 'color'){
        const inp = document.createElement('input');
        inp.type = 'color'; inp.value = CFG[c.k];
        inp.addEventListener('input', () => { CFG[c.k] = inp.value; refresh(); });
        row.appendChild(inp);
      }
      box.appendChild(row);
    });
  }

  document.getElementById('replay').addEventListener('click', () => {
    settings = readSettings();
    state.pos = entry();
    sweep(entry(), exit(), performance.now());
    wake();
  });

  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(CFG, DEFAULTS);
    state.seen = false;
    state.phase = 'idle';
    state.pos = null;
    buildPanel();
    renderContent();
    refresh();
  });

  let collapsed = false;
  document.getElementById('collapse').addEventListener('click', () => {
    collapsed = !collapsed;
    document.getElementById('panel').classList.toggle('collapsed', collapsed);
    document.getElementById('collapse').textContent = collapsed ? '+' : '−';
  });

  /* ================= 启动 ================= */
  settings = readSettings();
  renderContent();
  observer.observe(root);
  root.addEventListener('pointerenter', onEnter);
  root.addEventListener('pointermove', onMove);
  root.addEventListener('pointerleave', onLeave);

  buildPanel();
  draw();
  wake();

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 80); });
})();

  /* ================= 移动端：点面板标题栏展开/收起抽屉 (mobile-adapt-v1) ================= */
  (function(){
    var panel = document.getElementById('panel');
    if (!panel) return;
    var header = panel.querySelector('header');
    if (!header) return;
    header.addEventListener('click', function(e){
      // 别抢走「折叠」按钮的点击
      if (e.target && e.target.closest && e.target.closest('button')) return;
      panel.classList.toggle('open');
    });
  })();

</script>
</body>
</html>
