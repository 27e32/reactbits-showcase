<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechText · React Bits 效果预览台</title>
<style>
  :root{
    --bg:#0a0b0d;
    --panel:rgba(16,18,22,.86);
    --line:rgba(255,255,255,.13);
    --dim:rgba(255,255,255,.46);
    --ink:#e8ebef;
    --accent:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1300px 700px at 50% 42%, #16191f 0%, #0a0b0d 72%);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }
  #grid{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.038) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.038) 1px, transparent 1px);
    background-size:40px 40px;
    -webkit-mask-image:radial-gradient(900px 460px at 50% 46%, #000 15%, transparent 78%);
    mask-image:radial-gradient(900px 460px at 50% 46%, #000 15%, transparent 78%);
  }
  #wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{
    width:100%;height:480px;position:relative;
    cursor:crosshair;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #scene{display:block;width:100%;height:100%;overflow:visible}

  .lfill,.lstroke{pointer-events:none;-webkit-user-select:none;user-select:none}

  /* ---------- 控制面板 ---------- */
  #panel{
    position:fixed;top:16px;right:16px;width:272px;z-index:20;
    background:var(--panel);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    font-size:12px;
    max-height:calc(100vh - 32px);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  #panel header{
    display:flex;align-items:center;gap:8px;
    padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #panel header b{font-weight:600;letter-spacing:.02em;flex:1;font-size:12.5px}
  #panel header .tag{
    font-size:10px;color:var(--dim);border:1px solid var(--line);
    padding:1px 6px;border-radius:99px;
  }
  #panel header button{
    appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);
    width:20px;height:20px;line-height:1;border-radius:6px;cursor:pointer;font-size:12px;
    display:grid;place-items:center;padding:0;
  }
  #panel header button:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  #controls{padding:12px 13px 6px;overflow-y:auto;overflow-x:hidden}
  #panel.collapsed #controls,#panel.collapsed footer{display:none}

  .row{
    display:grid;grid-template-columns:66px 1fr 40px;
    align-items:center;gap:8px;margin-bottom:9px;
  }
  .row>span{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row>em{
    font-style:normal;text-align:right;color:#fff;opacity:.85;
    font-size:10.5px;font-variant-numeric:tabular-nums;
  }
  .row.two{grid-template-columns:66px 1fr}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:99px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer;accent-color:#fff;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    background:#fff;border:none;box-shadow:0 0 0 3px rgba(255,255,255,.13);
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;background:#fff;border:none;
  }
  input[type=text],select{
    width:100%;background:rgba(255,255,255,.05);color:#fff;
    border:1px solid var(--line);border-radius:7px;padding:4px 7px;
    font-family:inherit;font-size:11.5px;outline:none;
  }
  input[type=text]:focus,select:focus{border-color:rgba(255,255,255,.34)}
  select option{background:#14161a;color:#e8ebef}
  input[type=color]{
    -webkit-appearance:none;appearance:none;border:1px solid var(--line);
    background:transparent;width:100%;height:22px;border-radius:7px;padding:1px;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
  .sw{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 0;color:var(--dim);font-size:11px;cursor:pointer;
  }
  .sw input{display:none}
  .sw i{
    width:26px;height:15px;border-radius:99px;background:rgba(255,255,255,.14);
    position:relative;transition:.18s;flex:0 0 auto;
  }
  .sw i::after{
    content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#8c939c;transition:.18s;
  }
  .sw input:checked+i{background:rgba(255,255,255,.9)}
  .sw input:checked+i::after{transform:translateX(11px);background:#0a0b0d}
  hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0 10px}
  #panel footer{padding:0 13px 12px;flex:0 0 auto}
  #reset{
    width:100%;appearance:none;background:rgba(255,255,255,.055);color:var(--dim);
    border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;
    font-family:inherit;cursor:pointer;letter-spacing:.03em;
  }
  #reset:hover{color:#fff;background:rgba(255,255,255,.1)}

  #hint{
    position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.06em;pointer-events:none;
  }
  #hint kbd{
    font-family:inherit;border:1px solid rgba(255,255,255,.16);border-radius:4px;
    padding:1px 5px;color:rgba(255,255,255,.44);
  }

  /* ================= 移动端适配 (mobile-adapt-v1) ================= */
  @media (max-width: 820px){
    /* 画布吃满整个视口，并接管触摸手势（几个页面都是全屏交互画布，不需要页面滚动） */
    #stage{
      height: 100vh;
      height: 100dvh;
      touch-action: none;
    }
    /* 底部提示在窄屏会换行挡内容，直接隐藏 */
    #hint{ display: none; }
    /* 诊断信息移到顶部，抽屉展开时也能看到 */
    #stats{
      top: 10px;
      bottom: auto;
      left: 12px;
      right: 12px;
      font-size: 9.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 控制面板改造成底部抽屉：默认只露出顶部 50px */
    #panel{
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 64vh;
      height: 64dvh;
      max-height: none;
      border-radius: 16px 16px 0 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      transform: translateY(calc(100% - 50px));
      transition: transform .3s cubic-bezier(.22,1,.36,1);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    #panel.open{ transform: translateY(0); }
    #panel header{
      position: relative;
      padding-top: 17px;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    /* 抽屉把手 */
    #panel header::before{
      content: '';
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,.22);
    }
  }

</style>
</head>
<body>
<div id="grid"></div>

<div id="wrap">
  <div id="stage">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg">
      <g id="wordmark">
        <g id="letters"></g>
        <g id="overlay">
          <g id="selGroup" opacity="0">
            <rect id="selRect" fill="none"/>
            <path id="selCorners" fill="none"/>
            <line id="selConn" stroke-dasharray="2 3"/>
          </g>
          <text id="labelA" xml:space="preserve"></text>
          <text id="labelB" xml:space="preserve"></text>
          <g id="specks"></g>
        </g>
      </g>
    </svg>
  </div>
</div>

<aside id="panel">
  <header>
    <b>TechText</b>
    <span class="tag">react-bits</span>
    <button id="collapse" title="折叠">−</button>
  </header>
  <div id="controls"></div>
  <footer><button id="reset">恢复默认参数</button></footer>
</aside>

<div id="hint">移动鼠标让字母变成矢量轮廓 · 按下并拖动字母可以把它拽离基线 · 移出画面后自动扫描</div>

<script>
(function(){
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const DEFAULTS = {
    text: 'React Bits',
    fontFamily: '',
    fontWeight: 600,
    fontSize: 150,
    letterSpacing: -0.05,
    color: '#ffffff',
    accentColor: '#ffffff',
    reveal: 'letter',
    reach: 200,
    softness: 0.7,
    dashLength: 4,
    dashGap: 2,
    lineStyle: 'dashed',
    strokeWidth: 1.5,
    specks: 15,
    selection: true,
    labels: true,
    draggable: true,
    sweep: true,
    speed: 1
  };
  const CFG = Object.assign({}, DEFAULTS);

  const FALLBACK_FONT = "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";

  const $ = (s) => document.querySelector(s);
  const stage    = $('#stage');
  const scene    = $('#scene');
  const wordmark = $('#wordmark');
  const lettersG = $('#letters');
  const selGroup = $('#selGroup');
  const selRect  = $('#selRect');
  const selCorn  = $('#selCorners');
  const selConn  = $('#selConn');
  const labelA   = $('#labelA');
  const labelB   = $('#labelB');
  const specksG  = $('#specks');
  const mctx     = document.createElement('canvas').getContext('2d');

  /* ---------------- 状态 ---------------- */
  let W = 0, H = 0;
  let tx = 0, ty = 0, vs = 1;          // 外层 transform / 适配缩放
  let designW = 0, designH = 0, ascent = 0, descent = 0;
  let letters = [];
  let speckEls = [];
  let frame = { x:0, y:0, w:0, h:0, init:false };
  let last = performance.now();
  let dragging = null;
  const pointer = { x:0, y:0, dx:0, dy:0, inside:false, down:false, grabX:0, grabY:0 };

  /* ---------------- 工具 ---------------- */
  const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
  function smoothstep(e0,e1,x){
    const d = (e1 - e0) || 1e-6;
    const t = clamp((x - e0) / d, 0, 1);
    return t*t*(3 - 2*t);
  }
  function hash2(a,b){
    const v = Math.sin(a*127.1 + b*311.7) * 43758.5453;
    return v - Math.floor(v);
  }
  const fontStr = (px) => `${CFG.fontWeight} ${px}px ${CFG.fontFamily || FALLBACK_FONT}`;

  /* ---------------- 构建 ---------------- */
  function build(){
    lettersG.textContent = '';
    letters = [];
    const chars = Array.from(CFG.text);
    chars.forEach((ch, i) => {
      const g  = document.createElementNS(NS,'g');
      const f  = document.createElementNS(NS,'text');
      const st = document.createElementNS(NS,'text');
      f.setAttribute('class','lfill');
      st.setAttribute('class','lstroke');
      f.setAttribute('xml:space','preserve');
      st.setAttribute('xml:space','preserve');
      f.textContent = ch === ' ' ? '\u00A0' : ch;
      st.textContent = ch === ' ' ? '\u00A0' : ch;
      g.appendChild(f); g.appendChild(st);
      lettersG.appendChild(g);
      letters.push({ ch, g, f, st, idx:i, x:0, w:0, cx:0, cy:0, ox:0, oy:0, vx:0, vy:0, hover:0 });
    });
  }

  function styleLetters(){
    letters.forEach(l => {
      [l.f, l.st].forEach(el => {
        el.setAttribute('x', 0);
        el.setAttribute('y', 0);
        el.setAttribute('text-anchor','start');
        el.setAttribute('font-size', CFG.fontSize);
        el.setAttribute('font-weight', CFG.fontWeight);
        el.setAttribute('font-family', CFG.fontFamily || FALLBACK_FONT);
      });
      l.f.setAttribute('fill', CFG.color);
      l.f.setAttribute('stroke','none');
      l.st.setAttribute('fill','none');
      l.st.setAttribute('stroke', CFG.color);
      l.st.setAttribute('stroke-width', CFG.strokeWidth);
      l.st.setAttribute('stroke-linejoin','round');
      l.st.setAttribute('stroke-linecap','butt');
      l.st.setAttribute('stroke-dasharray',
        (CFG.lineStyle === 'solid' || CFG.dashLength <= 0) ? 'none' : `${CFG.dashLength} ${CFG.dashGap}`);
      l.st.setAttribute('vector-effect','non-scaling-stroke');
    });
    selRect.setAttribute('stroke', CFG.accentColor);
    selRect.setAttribute('stroke-width', 1);
    selRect.setAttribute('vector-effect','non-scaling-stroke');
    selCorn.setAttribute('stroke', CFG.accentColor);
    selCorn.setAttribute('stroke-width', 1.4);
    selCorn.setAttribute('vector-effect','non-scaling-stroke');
    selConn.setAttribute('stroke', CFG.accentColor);
    selConn.setAttribute('stroke-width', 1);
    selConn.setAttribute('vector-effect','non-scaling-stroke');
    if (dragging) { /* 拖动时保持手型 */ }
    scene.style.cursor = 'crosshair';
    if (dragging) scene.style.cursor = 'grabbing';
  }

  function buildSpecks(){
    specksG.textContent = '';
    speckEls = [];
    for (let i = 0; i < CFG.specks; i++){
      const r = document.createElementNS(NS,'rect');
      r.setAttribute('fill', CFG.accentColor);
      specksG.appendChild(r);
      speckEls.push(r);
    }
  }

  /* ---------------- 布局 ---------------- */
  function layout(){
    const r = stage.getBoundingClientRect();
    W = Math.max(300, r.width);
    H = Math.max(180, r.height);
    scene.setAttribute('viewBox', `0 0 ${W} ${H}`);

    mctx.font = fontStr(CFG.fontSize);
    const gap = CFG.letterSpacing * CFG.fontSize;
    let widths = letters.map(l => mctx.measureText(l.ch).width);
    if (widths.some(w => !w)) widths = letters.map(l => mctx.measureText(l.ch === ' ' ? 'n' : l.ch).width * (l.ch === ' ' ? 0.3 : 1));

    designW = widths.reduce((a,b)=>a+b,0) + gap * Math.max(0, letters.length - 1);

    const m = mctx.measureText(CFG.text.replace(/ /g,'\u00A0')) || {};
    ascent  = m.actualBoundingBoxAscent  || CFG.fontSize * 0.72;
    descent = m.actualBoundingBoxDescent || CFG.fontSize * 0.24;
    if (ascent < CFG.fontSize * 0.2) ascent = CFG.fontSize * 0.72;
    if (descent < 1) descent = CFG.fontSize * 0.2;
    designH = ascent + descent;

    const fitW = (W * 0.88) / designW;
    const fitH = (H * 0.74) / designH;
    vs = Math.min(1, fitW, fitH);           // "Largest font size in px" — 只缩不放

    tx = (W - designW * vs) / 2;
    ty = (H - designH * vs) / 2;
    wordmark.setAttribute('transform', `translate(${tx} ${ty}) scale(${vs})`);

    let x = 0;
    letters.forEach((l,i) => {
      l.w  = widths[i];
      l.x  = x;
      l.cx = x + widths[i] / 2;
      l.cy = designH / 2;
      x += widths[i] + gap;
    });
    frame.init = false;
  }

  /* ---------------- 交互 ---------------- */
  const pt = scene.createSVGPoint ? scene.createSVGPoint() : null;
  function toDesign(e){
    if (pt){
      pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(scene.getScreenCTM().inverse());
      pointer.x = p.x; pointer.y = p.y;
    } else {
      const r = stage.getBoundingClientRect();
      pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top;
    }
    pointer.dx = (pointer.x - tx) / vs;
    pointer.dy = (pointer.y - ty) / vs;
  }

  function nearestLetter(){
    if (!pointer.inside) return -1;
    let best = -1, bd = Infinity;
    for (const l of letters){
      const d = Math.abs(pointer.dx - (l.x + l.w / 2));
      if (d < bd){ bd = d; best = l.idx; }
    }
    return best;
  }

  function hitLetter(){
    for (const l of letters){
      const x0 = l.x + l.ox, x1 = x0 + l.w;
      const y0 = -ascent + l.oy, y1 = designH - ascent + l.oy;
      if (pointer.dx >= x0 - 3 && pointer.dx <= x1 + 3 && pointer.dy >= y0 && pointer.dy <= y1) return l;
    }
    return null;
  }

  stage.addEventListener('pointermove', (e) => {
    toDesign(e);
    if (dragging){
      dragging.ox = pointer.dx - dragging.x - dragging.grabX;
      dragging.oy = pointer.dy - ascent - dragging.grabY;
      dragging.vx = 0; dragging.vy = 0;
    } else if (CFG.draggable){
      scene.style.cursor = hitLetter() ? 'grab' : 'crosshair';
    }
  }, { passive:true });

  stage.addEventListener('pointerenter', (e) => { pointer.inside = true; toDesign(e); });
  stage.addEventListener('pointerleave', () => {
    pointer.inside = false;
    if (dragging) endDrag();
  });

  stage.addEventListener('pointerdown', (e) => {
    toDesign(e);
    const l = hitLetter();
    if (l && CFG.draggable){
      dragging = l;
      dragging.grabX = pointer.dx - l.x - l.ox;
      dragging.grabY = pointer.dy - ascent - l.oy;
      stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
      scene.style.cursor = 'grabbing';
    }
  });

  function endDrag(){ dragging = null; scene.style.cursor = 'crosshair'; }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------------- 主循环 ---------------- */
  function tick(now){
    const dt = clamp((now - last) / 1000, 0.001, 0.05);
    last = now;
    const T = now / 1000;
    const n = letters.length;

    /* 1. 决定激活的字母 */
    let activeIdx = -1;
    if (pointer.inside) activeIdx = nearestLetter();
    else if (CFG.sweep && CFG.reveal !== 'off' && CFG.speed > 0 && n){
      activeIdx = Math.floor((T * CFG.speed * 1.15) % n);
    }

    /* 2. 每个字母的 hover 权重 */
    const rate = 6 + (1 - CFG.softness) * 9;
    const k = 1 - Math.exp(-dt * rate);
    const inner = CFG.reach * (1 - CFG.softness);
    const outer = Math.max(inner + 1, CFG.reach);

    for (let i = 0; i < n; i++){
      const l = letters[i];
      let target = 0;
      if (CFG.reveal === 'letter'){
        target = (i === activeIdx && !dragging) ? 1 : (dragging === l ? 1 : 0);
      } else if (CFG.reveal === 'area'){
        if (pointer.inside || (CFG.sweep && CFG.speed > 0)){
          let px, py;
          if (pointer.inside){ px = pointer.dx; py = pointer.dy; }
          else {
            const sweepPx = ((T * CFG.speed * 220) % (W + 500)) - 250;
            px = (sweepPx - tx) / vs;
            py = designH / 2;
          }
          const d = Math.hypot(l.cx - px, l.cy - py);
          target = 1 - smoothstep(inner, outer, d);
        } else target = 0;
      }
      l.hover += (target - l.hover) * k;
      if (l.hover < 0.0015) l.hover = 0;

      /* 弹簧回位 */
      if (dragging !== l){
        const f = dt * 60;
        l.vx += (-0.20 * l.ox) * f;
        l.vy += (-0.20 * l.oy) * f;
        const damp = Math.pow(0.87, f);
        l.vx *= damp; l.vy *= damp;
        l.ox += l.vx * f; l.oy += l.vy * f;
        if (Math.abs(l.ox) < 0.05 && Math.abs(l.vx) < 0.05){ l.ox = 0; l.vx = 0; }
        if (Math.abs(l.oy) < 0.05 && Math.abs(l.vy) < 0.05){ l.oy = 0; l.vy = 0; }
      }

      /* 应用 */
      l.g.setAttribute('transform', `translate(${l.x + l.ox} ${ascent + l.oy})`);
      l.f.setAttribute('opacity', (1 - l.hover).toFixed(3));
      l.st.setAttribute('opacity', l.hover.toFixed(3));
    }

    /* 3. 选择框 */
    const focusIdx = dragging ? dragging.idx : activeIdx;
    const focus = (focusIdx >= 0 && CFG.selection) ? letters[focusIdx] : null;
    const showFrame = !!focus && (focus.hover > 0.02 || dragging === focus);

    if (showFrame){
      const pad = 12;
      const tw = focus.w + pad * 2;
      const th = designH + pad * 1.4;
      const txp = focus.x + focus.ox - pad;
      const typ = focus.oy - pad * 0.7;
      if (!frame.init){
        frame.x = txp; frame.y = typ; frame.w = tw; frame.h = th; frame.init = true;
      } else {
        const g = 1 - Math.exp(-dt * 12);
        frame.x += (txp - frame.x) * g;
        frame.y += (typ - frame.y) * g;
        frame.w += (tw - frame.w) * g;
        frame.h += (th - frame.h) * g;
      }
      selGroup.setAttribute('opacity', (0.9 * Math.min(1, focus.hover * 3)).toFixed(3));

      const fx = frame.x, fy = frame.y, fw = frame.w, fh = frame.h;
      selRect.setAttribute('x', fx); selRect.setAttribute('y', fy);
      selRect.setAttribute('width', fw); selRect.setAttribute('height', fh);
      selRect.setAttribute('opacity', 0.32);

      const c = Math.max(6, 11 / vs);
      selCorn.setAttribute('d', [
        `M${fx} ${fy+c} V${fy} H${fx+c}`,
        `M${fx+fw-c} ${fy} H${fx+fw} V${fy+c}`,
        `M${fx+fw} ${fy+fh-c} V${fy+fh} H${fx+fw-c}`,
        `M${fx+c} ${fy+fh} H${fx} V${fy+fh-c}`
      ].join(' '));
      selCorn.setAttribute('opacity', 0.95);

      /* 连接线：指针 → 框最近边 */
      if (pointer.inside){
        const ax = clamp(pointer.dx, fx, fx + fw);
        const ay = clamp(pointer.dy, fy, fy + fh);
        const len = Math.hypot(pointer.dx - ax, pointer.dy - ay);
        selConn.setAttribute('opacity', len > 6 ? 0.5 : 0);
        selConn.setAttribute('x1', ax); selConn.setAttribute('y1', ay);
        selConn.setAttribute('x2', pointer.dx); selConn.setAttribute('y2', pointer.dy);
      } else {
        selConn.setAttribute('opacity', 0);
      }

      /* 标签 */
      if (CFG.labels){
        const fs = Math.max(9, 11 / vs);
        const gapY = Math.max(6, 8 / vs);
        labelA.setAttribute('font-size', fs);
        labelA.setAttribute('font-family', CFG.fontFamily || FALLBACK_FONT);
        labelA.setAttribute('font-weight', 500);
        labelA.setAttribute('fill', CFG.accentColor);
        labelA.setAttribute('opacity', 0.92);
        labelA.setAttribute('x', fx);
        labelA.setAttribute('y', fy - gapY * 0.5);
        labelA.textContent = focus.ch === ' ' ? '␣' : focus.ch;

        labelB.setAttribute('font-size', fs * 0.86);
        labelB.setAttribute('font-family', CFG.fontFamily || FALLBACK_FONT);
        labelB.setAttribute('font-weight', 400);
        labelB.setAttribute('fill', CFG.accentColor);
        labelB.setAttribute('opacity', 0.6);
        labelB.setAttribute('text-anchor', 'end');
        labelB.setAttribute('x', fx + fw);
        labelB.setAttribute('y', fy + fh + gapY * 1.5);
        labelB.textContent = (dragging === focus && (Math.abs(focus.ox) > 1 || Math.abs(focus.oy) > 1))
          ? `${focus.ox >= 0 ? '+' : '−'}${Math.abs(focus.ox).toFixed(0)}  ${focus.oy >= 0 ? '+' : '−'}${Math.abs(focus.oy).toFixed(0)}`
          : `${Math.round(CFG.fontSize * vs)}px`;
      } else {
        labelA.textContent = ''; labelB.textContent = '';
      }
    } else {
      selGroup.setAttribute('opacity', 0);
      labelA.textContent = ''; labelB.textContent = '';
    }

    /* 4. specks */
    if (speckEls.length){
      const src = (focusIdx >= 0) ? letters[focusIdx] : null;
      const baseOp = src ? Math.max(src.hover, dragging === src ? 1 : 0) : 0;
      if (baseOp > 0.04){
        const size = Math.max(1.2, 2.4 / vs);
        for (let i = 0; i < speckEls.length; i++){
          const seed = (src.idx + 1) * 97 + i * 13;
          const respawn = Math.floor(T * (0.8 + hash2(seed, 5) * 1.4) + hash2(seed, 1) * 5);
          const ang = hash2(seed, respawn) * Math.PI * 2;
          const rad = (0.55 + hash2(seed, respawn + 77) * 1.25) * CFG.fontSize * 0.62;
          const px = src.cx + src.ox + Math.cos(ang) * rad;
          const py = src.cy + src.oy + Math.sin(ang) * rad * 0.75;
          const blink = 0.5 + 0.5 * Math.sin(T * 3.1 + hash2(seed, 9) * 12);
          const el = speckEls[i];
          el.setAttribute('x', (px - size / 2).toFixed(2));
          el.setAttribute('y', (py - size / 2).toFixed(2));
          el.setAttribute('width', size.toFixed(2));
          el.setAttribute('height', size.toFixed(2));
          el.setAttribute('opacity', (baseOp * (0.18 + 0.82 * blink)).toFixed(3));
        }
        specksG.setAttribute('opacity', 1);
      } else {
        specksG.setAttribute('opacity', 0);
      }
    }

    requestAnimationFrame(tick);
  }

  /* ---------------- 控制面板 ---------------- */
  const CONTROLS = [
    { k:'text',          t:'text',   label:'文字内容', en:'text' },
    { k:'reveal',        t:'select', label:'显现模式', en:'reveal', opts:['letter','area','off'] },
    { k:'reach',         t:'range',  label:'影响半径', en:'reach',         min:0,   max:500, step:10 },
    { k:'softness',      t:'range',  label:'柔化程度', en:'softness',      min:0,   max:1,   step:.05 },
    { k:'dashLength',    t:'range',  label:'虚线长度', en:'dashLength',    min:0,   max:20,  step:.5 },
    { k:'dashGap',       t:'range',  label:'虚线间隔', en:'dashGap',       min:0,   max:20,  step:.5 },
    { k:'strokeWidth',   t:'range',  label:'线条粗细', en:'strokeWidth',   min:.25, max:6,   step:.25 },
    { k:'specks',        t:'range',  label:'微粒数量', en:'specks',        min:0,   max:60,  step:1 },
    { k:'speed',         t:'range',  label:'扫描速度', en:'speed',         min:0,   max:3,   step:.1 },
    { k:'fontSize',      t:'range',  label:'字号',     en:'fontSize',      min:60,  max:280, step:2 },
    { k:'letterSpacing', t:'range',  label:'字间距',   en:'letterSpacing', min:-.15,max:.1,  step:.005 },
    { k:'fontWeight',    t:'range',  label:'字重',     en:'fontWeight',    min:100, max:900, step:100 },
    { k:'__sep',         t:'sep' },
    { k:'color',         t:'color',  label:'文字颜色', en:'color' },
    { k:'accentColor',   t:'color',  label:'强调色',   en:'accentColor' },
    { k:'lineStyle',     t:'select', label:'线条样式', en:'lineStyle', opts:['dashed','solid'] },
    { k:'__sep2',        t:'sep' },
    { k:'selection',     t:'toggle', label:'选择框',   en:'selection' },
    { k:'labels',        t:'toggle', label:'显示标签', en:'labels' },
    { k:'draggable',     t:'toggle', label:'可拖拽',   en:'draggable' },
    { k:'sweep',         t:'toggle', label:'自动扫描', en:'sweep' }
  ];

  const OPT_LABELS = {
    reveal:    { letter:'单字母', area:'圆形区域', off:'关闭' },
    lineStyle: { dashed:'虚线',   solid:'实线' }
  };

  function rebuildStyleAndLayout(){ styleLetters(); layout(); }

  function buildPanel(){
    const box = $('#controls');
    box.textContent = '';
    CONTROLS.forEach(c => {
      if (c.t === 'sep'){
        const hr = document.createElement('hr'); hr.className = 'sep'; box.appendChild(hr); return;
      }
      if (c.t === 'toggle'){
        const lab = document.createElement('label'); lab.className = 'sw';
        const sp = document.createElement('span'); sp.textContent = c.label;
        const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!CFG[c.k];
        const ii = document.createElement('i');
        lab.append(sp, inp, ii);
        inp.addEventListener('change', () => { CFG[c.k] = inp.checked; });
        box.appendChild(lab);
        return;
      }
      const row = document.createElement('div');
      row.className = 'row' + (c.t === 'select' || c.t === 'text' || c.t === 'color' ? ' two' : '');
      const sp = document.createElement('span'); sp.textContent = c.label; sp.title = c.en || '';
      row.appendChild(sp);

      if (c.t === 'range'){
        const inp = document.createElement('input');
        inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = CFG[c.k];
        const em = document.createElement('em'); em.textContent = CFG[c.k];
        inp.addEventListener('input', () => {
          CFG[c.k] = parseFloat(inp.value);
          em.textContent = inp.value;
          if (c.k === 'specks') buildSpecks();
          if (c.k === 'fontSize' || c.k === 'letterSpacing' || c.k === 'fontWeight') layout();
          styleLetters();
        });
        row.append(inp, em);
      } else if (c.t === 'select'){
        const sl = document.createElement('select');
        c.opts.forEach(o => {
          const op = document.createElement('option');
          op.value = o;
          op.textContent = (OPT_LABELS[c.k] && OPT_LABELS[c.k][o]) || o;
          if (CFG[c.k] === o) op.selected = true;
          sl.appendChild(op);
        });
        sl.addEventListener('change', () => { CFG[c.k] = sl.value; styleLetters(); });
        row.appendChild(sl);
      } else if (c.t === 'text'){
        const inp = document.createElement('input');
        inp.type = 'text'; inp.value = CFG[c.k];
        inp.addEventListener('input', () => {
          CFG[c.k] = inp.value || ' ';
          build(); rebuildStyleAndLayout();
        });
        row.appendChild(inp);
      } else if (c.t === 'color'){
        const inp = document.createElement('input');
        inp.type = 'color'; inp.value = CFG[c.k];
        inp.addEventListener('input', () => {
          CFG[c.k] = inp.value;
          if (c.k === 'accentColor') buildSpecks();
          styleLetters();
        });
        row.appendChild(inp);
      }
      box.appendChild(row);
    });
  }

  $('#reset').addEventListener('click', () => {
    Object.assign(CFG, DEFAULTS);
    build(); buildSpecks(); buildPanel(); rebuildStyleAndLayout();
  });

  let collapsed = false;
  $('#collapse').addEventListener('click', () => {
    collapsed = !collapsed;
    $('#panel').classList.toggle('collapsed', collapsed);
    $('#collapse').textContent = collapsed ? '+' : '−';
    setTimeout(layout, 30);
  });

  /* ---------------- 启动 ---------------- */
  build();
  buildSpecks();
  buildPanel();
  styleLetters();
  layout();
  requestAnimationFrame(tick);

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });

  // 首屏自动演示一下 area 扫过
  setTimeout(() => { pointer.inside = false; }, 0);
})();

  /* ================= 移动端：点面板标题栏展开/收起抽屉 (mobile-adapt-v1) ================= */
  (function(){
    var panel = document.getElementById('panel');
    if (!panel) return;
    var header = panel.querySelector('header');
    if (!header) return;
    header.addEventListener('click', function(e){
      // 别抢走「折叠」按钮的点击
      if (e.target && e.target.closest && e.target.closest('button')) return;
      panel.classList.toggle('open');
    });
  })();

</script>
</body>
